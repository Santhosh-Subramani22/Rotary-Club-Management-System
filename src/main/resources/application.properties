# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# MySQL Database Configuration
# ==========================================
# Change "root" password if your local MySQL has a different password
spring.datasource.url=jdbc:mysql://localhost:3306/rotary_club_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Santhosh@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# Automatically creates or updates tables in MySQL based on your entity classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the Eclipse console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# Jackson JSON Formatting
# ==========================================
# Formats timestamps cleanly (e.g. yyyy-MM-dd HH:mm:ss instead of raw timestamps)
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# Logging Level
# ==========================================
logging.level.com.example.The.Rotary.Club=DEBUG
logging.level.org.hibernate.SQL=DEBUG